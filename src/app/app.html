<div class="shell">
  <aside class="sidebar">
    <a routerLink="/" class="brand" aria-label="PRISALY, inicio">
      <img src="prisaly-logo.png" alt="" width="56" height="42" />
      <span>
        <strong>PRISALY</strong>
        <small>Entorno de pruebas</small>
      </span>
    </a>
    <nav aria-label="Secciones">
      <ul>
        @for (link of links; track link.path) {
          <li>
            <a [routerLink]="link.path" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: link.path === '/' }"
              [attr.data-testid]="'nav-' + link.tag">
              <span class="nav__tag">{{ link.tag }}</span>{{ link.label }}
            </a>
          </li>
        }
      </ul>
    </nav>
    <div class="sidebar__session" data-testid="sidebar-session">
      @if (tokens.token() !== null) {
        <span class="dot dot--on" aria-hidden="true"></span>{{ tokens.user()?.correo ?? 'Sesión activa' }}
      } @else {
        <span class="dot" aria-hidden="true"></span>Sin sesión
      }
    </div>
  </aside>
  <main class="content">
    <router-outlet />
  </main>
</div>
