<main class="administracion modulo-admin">
  <a class="regreso" routerLink="/dashboard">← Inicio</a>
  <header class="cabecera-admin">
    <div>
      <p class="ceja">ADMINISTRACIÓN</p>
      <h1>Gestión de usuarios</h1>
      <p>Registra cuentas, consulta su acceso y administra permisos.</p>
    </div>
  </header>
  @if (operativo()) {
    <nav class="fila" aria-label="Gestión administrativa">
      <button
        type="button"
        (click)="pestana.set('docentes')"
        [attr.aria-pressed]="pestana() === 'docentes'"
      >
        Docentes
      </button>
      <button
        type="button"
        (click)="pestana.set('estudiantes')"
        [attr.aria-pressed]="pestana() === 'estudiantes'"
      >
        Estudiantes
      </button>
      <button
        type="button"
        (click)="pestana.set('permisos')"
        [attr.aria-pressed]="pestana() === 'permisos'"
      >
        Roles y permisos
      </button>
    </nav>
    @for (vistaActual of [pestana()]; track vistaActual) {
      <app-panel-administracion-m1 [vista]="vistaActual" />
      @if (vistaActual === 'estudiantes') {
        <app-panel-estudiantes-m1 [soloAlta]="true" />
      }
    }
  } @else {
    <p role="status">La gestión requiere una sesión administrativa verificada.</p>
  }
</main>
